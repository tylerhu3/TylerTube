worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Zero-copy file transfers & packet optimization for large video files
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;

    # File descriptor cache to avoid repeated disk lookups on video chunks
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # Gzip for UI assets (never compress MP4/WebM as it wastes CPU)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Client IP for the stream server's /api/ (visitor log, upload rate limit). Only trust
    # CF-Connecting-IP from cloudflared (it connects from localhost); a LAN client could
    # otherwise send any value. X-Forwarded-For is set, not appended, for the same reason.
    map $remote_addr $tylertube_cf_ip {
        127.0.0.1  $http_cf_connecting_ip;
        ::1        $http_cf_connecting_ip;
        default    "";
    }

    server {
        listen       8080;
        server_name  localhost 0.0.0.0;

        # Serve compiled React production bundle from dist/
        root   /Users/Shared/MyStreamingApp/dist;
        index  index.html;

        # React Single-Page Application (SPA) routing fallback
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Serve thumbnails directly from public/thumbnails/
        location /thumbnails/ {
            alias /Users/Shared/MyStreamingApp/public/thumbnails/;
            add_header Cache-Control "public, max-age=86400";
        }

        # Dedicated video & subtitle streaming block with HTTP Byte-Range support
        location /videos/ {
            alias /Users/Shared/MyStreamingApp/public/videos/;

            # Enable seeking and range requests on iOS/macOS Safari & desktop browsers
            add_header Accept-Ranges bytes;
            add_header Cache-Control "public, max-age=86400";

            # Allow local network & Vite dev server playback without CORS issues
            add_header Access-Control-Allow-Origin *;
        }

        # Synced watch progress / favorites / prefs (server/user-state.js) and visitor log
        # (server/visitors.js), both on the stream server
        location /api/ {
            proxy_pass http://127.0.0.1:5180;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Visitor log (server/visitors.js) reads the client IP (see the map above).
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP $tylertube_cf_ip;
            client_max_body_size 4m;
            add_header Cache-Control "no-store";
        }

        # Uploads (server/upload.js): the browser sends files in 8 MB chunks (max 16 MB per request,
        # under Cloudflare's 100 MB limit). Stream chunks straight through instead of buffering
        # them to disk, and give slow connections time to finish one.
        location /api/upload {
            proxy_pass http://127.0.0.1:5180;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header CF-Connecting-IP $tylertube_cf_ip;
            client_max_body_size 17m;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_body_timeout 300s;
            add_header Cache-Control "no-store";
        }

        # Proxy the WebCodecs player's H.264/PCM WebSocket stream to the standalone stream server
        # (npm run server, server/standalone.js, port 5180)
        location /ws/mpeg1 {
            proxy_pass http://127.0.0.1:5180;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
